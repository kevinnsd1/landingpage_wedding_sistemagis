version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisahmagis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-kisahmagis}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kisahmagis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
